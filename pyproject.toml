[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "resume-tailor"
version = "0.1.0"
description = "A source-grounded, ATS-friendly resume tailoring CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Aritra Sarkar" }]
keywords = ["resume", "ats", "cli", "latex"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1,<9",
  "keyring>=25.7,<26",
  "litellm>=1.80,<2",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
  "questionary>=2.1,<3",
  "rich>=14,<16",
  "typer>=0.24,<1",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1,<2"]
dev = [
  "build>=1.3,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "twine>=6,<7",
]

[project.scripts]
resume-tailor = "resume_tailor.cli:main"

[project.urls]
Repository = "https://github.com/aritra0309/resume_builder"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_tailor"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=resume_tailor --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=70"
testpaths = ["tests"]
markers = ["offline: test does not require a provider credential or network access"]

[tool.coverage.run]
branch = true
source = ["resume_tailor"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["resume_tailor"]

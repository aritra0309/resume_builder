name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install DOCX-capable test environment
        run: python -m pip install -e ".[dev,docx]"
      - name: Test package entry points
        run: |
          python -m resume_tailor --help
          resume-tailor --help
      - name: Run tests
        run: pytest -m offline
      - name: Enforce module coverage gates
        run: python scripts/check_module_coverage.py coverage.json
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Build wheel and source distribution
        run: python -m build
      - name: Inspect built archives
        run: |
          python -m zipfile -t dist/resume_tailor-*.whl
          python -c "import tarfile; tarfile.open('dist/resume_tailor-0.1.0.tar.gz').getmembers()"
      - name: Verify pipx installation
        shell: bash
        run: |
          python -m pip install pipx
          python -m pipx run --spec dist/resume_tailor-0.1.0-py3-none-any.whl resume-tailor --version
          python -m pipx run --spec dist/resume_tailor-0.1.0-py3-none-any.whl resume-tailor doctor || test $? -eq 8
      - uses: astral-sh/setup-uv@v5
      - name: Verify uv tool installation
        shell: bash
        run: |
          uv tool run --from dist/resume_tailor-0.1.0-py3-none-any.whl resume-tailor --version
          uv tool run --from "resume-tailor[docx] @ dist/resume_tailor-0.1.0-py3-none-any.whl" resume-tailor doctor || test $? -eq 8
